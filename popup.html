<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronos Time Tracker</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <h1>Chronos</h1>
      </div>
      <button id="open-dashboard" title="Open Full Dashboard">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </button>
    </header>

    <main>
      <div class="hero-stats">
        <span class="label">TODAY'S SCREEN TIME</span>
        <div class="total-time" id="total-time">0h 0m</div>
      </div>

      <div class="category-breakdown">
        <h3>Categories</h3>
        <div id="category-bars" class="category-bars"></div>
      </div>

      <div class="top-sites">
        <h3>Top Websites</h3>
        <ul id="sites-list" class="sites-list"></ul>
      </div>
    </main>
  </div>
  <script src="categories.js"></script>
  <script src="popup.js"></script>
</body>
</html>
